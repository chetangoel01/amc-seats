<h2 class="sr-only">__SUMMARY__</h2>
<style>
.am .day{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}
.am .shows{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:6px}
.am .mm{cursor:pointer;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px}
.am .mm.on{border-color:var(--text-accent);box-shadow:0 0 0 1px var(--text-accent)}
.am .av{fill:#1D9E75}.am .tk{fill:var(--border-strong)}.am .pk{fill:#378ADD}
.am .ic{color:#fff}.am .ict{color:var(--text-secondary)}
.am #am-big rect[data-o="1"]{cursor:pointer}
.am svg text{fill:var(--text-secondary);font-size:11px}
.am .cap{font-size:12px;color:var(--text-secondary)}
.am .sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="am-wc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16m-5 0a5 5 0 1 0 10 0a5 5 0 1 0 -10 0"/><path d="M19 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M19 17a3 3 0 0 0 -3 -3h-3.4"/><path d="M3 3h1a2 2 0 0 1 2 2v6"/><path d="M6 8h11"/><path d="M15 8v6"/></symbol>
<symbol id="am-cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></symbol>
</svg>
<div class="am">
<div class="cap" style="margin-bottom:10px">Seats as of __PULLED__</div>
<div id="am-overview"></div>
<div id="am-detail"></div>
<div class="cap" style="display:flex;flex-wrap:wrap;gap:16px;margin-top:10px">
<span><span class="sw" style="background:#1D9E75"></span>Open</span>
<span><span class="sw" style="background:var(--border-strong)"></span>Taken</span>
<span><span class="sw" style="background:#378ADD"></span>Your pick</span>
<span><svg width="13" height="13" style="vertical-align:-2px;margin-right:6px;color:var(--text-secondary)" aria-hidden="true"><use href="#am-wc"/></svg>Wheelchair</span>
<span><svg width="13" height="13" style="vertical-align:-2px;margin-right:6px;color:var(--text-secondary)" aria-hidden="true"><use href="#am-cp"/></svg>Companion</span>
<span><span class="sw" style="border:1px dashed var(--text-secondary);width:9px;height:9px"></span>Center zone</span>
</div>
</div>
<script>
const DATA = __DATA__;
const Z = DATA.zone;
const ICON = {1: "am-wc", 2: "am-cp"}, KIND = {1: "wheelchair", 2: "companion"};
const bits = s => [...s.a].map(h => parseInt(h, 16).toString(2).padStart(4, "0")).join("").replace(/^0*1/, "");
const seatsOf = s => { const b = bits(s); return DATA.layouts[s.l].map((x, i) => [x[0], x[1], x[2], x[3], +b[i]]); };

function geo(seats) {
  const rs = seats.map(x => x[0]), cs = seats.map(x => x[1]);
  const g = {r0: Math.min(...rs), r1: Math.max(...rs), c0: Math.min(...cs), c1: Math.max(...cs), letters: {}};
  for (const x of seats) g.letters[x[0]] ??= x[2].replace(/\d+$/, "");
  return g;
}
const cls = x => x[4] ? "av" : "tk";
const dayLabel = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
const where = (s, short) => [short ? DATA.theatres[s.t].replace(/^AMC /, "") : DATA.theatres[s.t], short ? s.f.replace(/ at AMC$/, "") : s.f, s.m].filter(Boolean).join(" · ");
const openCount = seats => seats.filter(x => x[4] && !x[3]).length;

function mini(seats) {
  const g = geo(seats);
  let s = "";
  for (const x of seats) s += `<rect x="${(x[1] - g.c0) * 3}" y="${(x[0] - g.r0) * 3}" width="2.4" height="2.4" rx=".4" class="${cls(x)}"/>`;
  return `<svg class="mini" viewBox="0 0 ${(g.c1 - g.c0 + 1) * 3} ${(g.r1 - g.r0 + 1) * 3}" width="100%" height="56" style="display:block" aria-hidden="true">${s}</svg>`;
}

const byDay = {};
for (const s of DATA.shows) (byDay[s.date] ??= []).push(s);
let html = "";
for (const [d, shows] of Object.entries(byDay)) {
  html += `<div class="day"><div class="cap" style="font-size:13px;padding-top:6px">${dayLabel(d)}</div><div class="shows">`;
  for (const s of shows) {
    const seats = seatsOf(s);
    html += `<div class="mm" role="button" tabindex="0" data-id="${s.id}"><div class="cap" style="color:var(--text-primary)">${s.time}</div><div class="cap" style="font-size:11px;line-height:1.3;margin-bottom:4px">${where(s, true)}</div>${mini(seats)}<div class="cap" style="font-size:11px;line-height:1.3;margin-top:4px">${openCount(seats)} open${s.e ? "<br>ends ~" + s.e : ""}</div></div>`;
  }
  html += `</div></div>`;
}
const overview = document.getElementById("am-overview"), detail = document.getElementById("am-detail");
overview.innerHTML = html;

function show(id) {
  overview.querySelectorAll(".mm").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  const sh = DATA.shows.find(s => s.id === id), seats = seatsOf(sh), g = geo(seats);
  const P = 15, X = 26, Y = 30, W = g.c1 - g.c0 + 1, H = g.r1 - g.r0 + 1;
  const zr0 = Math.ceil(Z.y0 * (H - 1)), zr1 = Math.floor(Z.y1 * (H - 1));
  const zc0 = Math.ceil(Z.x0 * (W - 1)), zc1 = Math.floor(Z.x1 * (W - 1));
  const inZone = x => { const r = x[0] - g.r0, c = x[1] - g.c0; return r >= zr0 && r <= zr1 && c >= zc0 && c <= zc1; };
  const zoneOpen = seats.filter(x => x[4] && !x[3] && inZone(x)).length;
  let s = `<text x="${X + W * P / 2}" y="11" text-anchor="middle">Screen</text>`;
  s += `<path d="M${X} 22 Q${X + W * P / 2} 10 ${X + W * P} 22" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"/>`;
  for (let r = g.r0; r <= g.r1; r++) {
    const L = g.letters[r] || "", y = Y + (r - g.r0) * P + 10;
    s += `<text x="${X - 8}" y="${y}" text-anchor="end">${L}</text><text x="${X + W * P + 6}" y="${y}">${L}</text>`;
  }
  const picked = new Set(sh.b ? sh.b.split(",") : []);
  for (const x of seats) {
    const sx = X + (x[1] - g.c0) * P, sy = Y + (x[0] - g.r0) * P;
    s += `<rect x="${sx}" y="${sy}" width="12" height="12" rx="2" class="${cls(x)}${picked.has(x[2]) ? " pk" : ""}" data-s="${x[2]}" data-o="${x[4]}" data-a="${x[3]}"/>`;
    if (x[3]) s += `<use href="#${ICON[x[3]]}" x="${sx + 1.5}" y="${sy + 1.5}" width="9" height="9" class="${x[4] ? "ic" : "ict"}" pointer-events="none"/>`;
  }
  s += `<rect x="${X + zc0 * P - 2}" y="${Y + zr0 * P - 2}" width="${(zc1 - zc0 + 1) * P + 1}" height="${(zr1 - zr0 + 1) * P + 1}" fill="none" stroke="var(--text-secondary)" stroke-dasharray="3 3" pointer-events="none"/>`;
  const url = "https://www.amctheatres.com/showtimes/" + sh.id + "/seats";
  detail.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin:24px 0 8px"><div><div style="font-size:16px;font-weight:500">${dayLabel(sh.date)}, ${sh.time}</div><div class="cap" style="font-size:13px">${where(sh)}${sh.w ? " · " + sh.w : ""} · ${openCount(seats)} open · ${zoneOpen} in center zone</div></div><a id="am-link" target="_blank" rel="noopener" style="color:var(--text-accent)"></a></div>`
    + `<svg id="am-big" viewBox="0 0 ${X * 2 + W * P + 4} ${Y + H * P + 4}" width="100%" role="img" aria-label="Seat map">${s}</svg>`
    + `<div id="am-readout" class="cap" style="min-height:18px;margin-top:6px">Tap open seats to pick them; the link opens AMC with them selected</div>`;
  const readout = document.getElementById("am-readout"), big = document.getElementById("am-big"), link = document.getElementById("am-link");
  const sync = () => { const names = [...picked].sort((p, q) => p.localeCompare(q, undefined, {numeric: true})); link.href = names.length ? url + "?seats=" + encodeURIComponent(names.join(",")) : url; link.textContent = names.length ? "Open on AMC with " + names.join(", ") : "Open on AMC"; };
  const describe = e => { const t = e.target.dataset; if (t && t.s) readout.textContent = `${t.s} · ${t.o === "1" ? "open" : "taken"}${KIND[t.a] ? " · " + KIND[t.a] : ""}`; };
  big.addEventListener("mouseover", describe);
  big.addEventListener("click", e => {
    describe(e);
    const n = e.target.dataset.s;
    if (!n || e.target.dataset.o !== "1") return;
    picked.has(n) ? picked.delete(n) : picked.add(n);
    e.target.classList.toggle("pk", picked.has(n));
    sync();
  });
  sync();
}
const pick = e => { const b = e.target.closest(".mm"); if (b && (e.type === "click" || e.key === "Enter" || e.key === " ")) { e.preventDefault(); show(b.dataset.id); } };
overview.addEventListener("click", pick);
overview.addEventListener("keydown", pick);
show(DATA.selected);
</script>
